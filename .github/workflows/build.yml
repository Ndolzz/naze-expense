name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build APK release (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: naze-expense-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK release (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: naze-expense-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
